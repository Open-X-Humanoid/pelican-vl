task: omni_spatial
dataset_path: "json"
visual_root: ../../../datasets/OmniSpatial/OmniSpatial-test
dataset_kwargs:
  data_files:
    - ../../../datasets/OmniSpatial/OmniSpatial-test/data.json
test_split: train
output_type: generate_until

metric_list:
  - metric: omni_spatial_score
    aggregation: !function utils.omni_spatial_aggregate_score
    higher_is_better: true

doc_to_visual: !function utils.omni_spatial_doc_to_visual
doc_to_text: !function utils.omni_spatial_doc_to_text
doc_to_target: !function utils.omni_spatial_doc_to_answer
process_results: !function utils.omni_spatial_process_results_generation
lmms_eval_specific_kwargs:
  default:
    eval_type: "direct"
    prompt_type: "none"
